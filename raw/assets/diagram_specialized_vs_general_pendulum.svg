<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.5px; }
      .col-spec { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.5px; }
      .col-gen { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.5px; }
      .box-conv { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5px; }

      .badge-spec { fill: #e11d48; }
      .badge-gen { fill: #2563eb; }
      .badge-conv { fill: #16a34a; }

      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 700; }
      .title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 13.5px; font-weight: 700; }
      .item-title { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 12px; font-weight: 600; }
      .item-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 11px; font-weight: 400; }
      
      .arrow-main { stroke: #64748b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .arrow-dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; stroke-linecap: round; fill: none; }
      .arrow-head { fill: #64748b; }
      .arrow-text { fill: #475569; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Pretendard", sans-serif; font-size: 10.5px; font-weight: 600; text-anchor: middle; }

      @media (prefers-color-scheme: dark) {
        .bg { fill: #090d16; stroke: #1e293b; }
        .col-spec { fill: #1f1315; stroke: #4c1d24; }
        .col-gen { fill: #111a2e; stroke: #1e3a5f; }
        .box-conv { fill: #0d2019; stroke: #134e38; }

        .badge-spec { fill: #fb7185; }
        .badge-gen { fill: #60a5fa; }
        .badge-conv { fill: #4ade80; }

        .badge-text { fill: #0f172a; }
        .title { fill: #f8fafc; }
        .item-title { fill: #e2e8f0; }
        .item-sub { fill: #94a3b8; }
        
        .arrow-main { stroke: #94a3b8; }
        .arrow-dash { stroke: #64748b; }
        .arrow-head { fill: #94a3b8; }
        .arrow-text { fill: #cbd5e1; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow-head" />
    </marker>
  </defs>

  <!-- Outer Background Container -->
  <rect width="880" height="290" rx="10" class="bg"/>

  <!-- Left Column: 특화 연산기 (계산기 계보) -->
  <rect x="18" y="18" width="370" height="185" rx="8" class="col-spec"/>
  <rect x="30" y="30" width="105" height="20" rx="4" class="badge-spec"/>
  <text x="82.5" y="44.5" text-anchor="middle" class="badge-text">특화 연산기 (계산기)</text>
  <text x="145" y="45" class="title">수치 연산·행렬곱 가속의 극대화</text>

  <!-- Left Items -->
  <!-- 19C 차분 기관 -->
  <text x="32" y="78" class="item-title">19C 차분 기관</text>
  <text x="150" y="78" class="item-sub">유한 차분법 고정 기어로 수학 표 계산 자동화</text>

  <!-- 2010s TPU / AI ASIC -->
  <text x="32" y="112" class="item-title">2010s TPU / ASIC</text>
  <text x="150" y="112" class="item-sub">시스톨릭 어레이 기반 GEMM 특화 (TOPS/W 극대화)</text>

  <!-- 2020s Groq LPU -->
  <text x="32" y="146" class="item-title">2020s Groq LPU</text>
  <text x="150" y="146" class="item-sub">온칩 SRAM &amp; 정적 컴파일러 스케줄링 (Zero-Jitter)</text>

  <text x="32" y="182" class="item-sub" style="font-size:10px;">★ 특성: 극상의 전력 효율 / 한계: 알고리즘 고착화, 비선형 제어 취약</text>


  <!-- Right Column: 범용 제어기 (컴퓨터 계보) -->
  <rect x="492" y="18" width="370" height="185" rx="8" class="col-gen"/>
  <rect x="504" y="30" width="105" height="20" rx="4" class="badge-gen"/>
  <text x="556.5" y="44.5" text-anchor="middle" class="badge-text">범용 제어기 (컴퓨터)</text>
  <text x="619" y="45" class="title">기호 조작·분기·오케스트레이션</text>

  <!-- Right Items -->
  <!-- 19C 해석 기관 -->
  <text x="506" y="78" class="item-title">19C 해석 기관</text>
  <text x="620" y="78" class="item-sub">Mill-Store 분리 &amp; 천공 카드로 기호 관계 직조</text>

  <!-- 20C 저장 프로그램 -->
  <text x="506" y="112" class="item-title">20C EDSAC / CPU</text>
  <text x="620" y="112" class="item-sub">메모리 적재 명령어 &amp; 범용 OS·소프트웨어 스택</text>

  <!-- 2020s 고밀도 서버 CPU -->
  <text x="506" y="146" class="item-title">2020s Host CPU</text>
  <text x="620" y="146" class="item-sub">에이전틱 AI 오케스트레이션 &amp; KV 캐시 계층 관리</text>

  <text x="506" y="182" class="item-sub" style="font-size:10px;">★ 특성: 임의 튜링 완전 제어, 빠른 분기 / 한계: 텐서 연산 시 전력 낭비</text>


  <!-- Center Oscillating Arrows (진자 운동 화살표) -->
  <!-- 1. 차분기관 -> 해석기관 -->
  <path d="M 390 74 L 488 74" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="440" y="68" class="arrow-text">기호 제어 필요</text>

  <!-- 2. 단일 CPU 한계 -> 도메인 특화 TPU -->
  <path d="M 488 108 L 394 108" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="440" y="102" class="arrow-text">전력 장벽·DSA</text>

  <!-- 3. 에이전틱 AI -> CPU 재부각 -->
  <path d="M 390 142 L 488 142" class="arrow-main" marker-end="url(#arrow)"/>
  <text x="440" y="136" class="arrow-text">에이전트 제어</text>


  <!-- Bottom Convergence Box (이종 컴퓨팅 수렴) -->
  <rect x="18" y="215" width="844" height="60" rx="8" class="box-conv"/>
  <rect x="30" y="225" width="125" height="20" rx="4" class="badge-conv"/>
  <text x="92.5" y="239.5" text-anchor="middle" class="badge-text">2026+ 아키텍처 수렴</text>

  <text x="168" y="239" class="title">이종 실행 모델 (Heterogeneous Execution Model) 로의 안착</text>
  <text x="32" y="262" class="item-sub">수치 연산 가속(ASIC / Tensor Core) + 시스템 기호 제어(Host CPU)를 NVLink-C2C / PCIe Gen6 / CXL 하드웨어 일관성 버스로 통합</text>

  <!-- Diagonal Connector Arrows to Convergence -->
  <path d="M 203 203 L 203 213" class="arrow-dash" marker-end="url(#arrow)"/>
  <path d="M 677 203 L 677 213" class="arrow-dash" marker-end="url(#arrow)"/>
</svg>